<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFDC Budget Management System - เข้าสู่ระบบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-brand .icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary-color), #818cf8);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
        }

        .login-brand h1 {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .login-brand p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: var(--shadow-xl);
        }

        .login-card h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--text-main);
            text-align: center;
        }

        .login-card .form-group {
            margin-bottom: 20px;
        }

        .login-card .form-label {
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .login-card .form-control {
            padding: 12px 14px;
            font-size: 0.95rem;
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-icon-wrapper .form-control {
            padding-left: 40px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            margin-top: 8px;
        }

        .login-error {
            background: var(--danger-light);
            color: var(--danger);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .login-error.show {
            display: flex;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 0.78rem;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-brand">
            <div class="icon"><i class="fa-solid fa-wallet"></i></div>
            <h1>AFDC Budget Management System</h1>
            <p>ระบบบริหารงบประมาณ</p>
        </div>

        <div class="login-card">
            <h2>เข้าสู่ระบบ</h2>

            <div class="login-error" id="loginError">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="loginErrorText"></span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">ชื่อผู้ใช้งาน (Username)</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" class="form-control" placeholder="ระบุชื่อผู้ใช้" required
                            autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">รหัสผ่าน (Password)</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" class="form-control" placeholder="ระบุรหัสผ่าน" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary login-btn">
                    <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
                </button>
            </form>

            <div class="login-footer">
                <p>
                    &copy; 2026 AFDC Budget Management System
                </p>
            </div>
        </div>

        <script src="app.js"></script>
        <script>
            // Simple page protection check for login
            document.addEventListener('DOMContentLoaded', () => {
                const session = getCurrentSession();
                if (session) {
                    window.location.href = 'index.html';
                }
            });

            async function handleLogin(e) {
                e.preventDefault();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const errorEl = document.getElementById('loginError');
                const errorText = document.getElementById('loginErrorText');

                errorEl.classList.remove('show');

                try {
                    // Fetch real data from Google Sheets first
                    await initData();

                    const result = loginUser(username, password);
                    if (result.success) {
                        window.location.href = 'index.html';
                    } else {
                        errorText.textContent = result.message;
                        errorEl.classList.add('show');
                    }
                } catch (err) {
                    errorText.textContent = "ไม่สามารถเชื่อมต่อกับฐานข้อมูลได้: " + err.message;
                    errorEl.classList.add('show');
                }
            }
        </script>
</body>

</html>
